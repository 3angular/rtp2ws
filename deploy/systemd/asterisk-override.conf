# Drop-in for Debian's asterisk.service (installed by install.sh as
# /etc/systemd/system/asterisk.service.d/rtp2ws.conf).
#
# Renders /etc/asterisk from /etc/rtp2ws/rtp2ws.yaml on every (re)start —
# the native equivalent of the container entrypoint (spec §9) — so YAML edits
# take effect with `systemctl restart asterisk`.
[Service]
ExecStartPre=/usr/bin/python3 /opt/rtp2ws/render-config.py /etc/rtp2ws/rtp2ws.yaml
# pjsip.conf / ari.conf carry credentials; keep them off world-readable.
ExecStartPre=/bin/sh -c 'chgrp asterisk /etc/asterisk/pjsip.conf /etc/asterisk/ari.conf && chmod 640 /etc/asterisk/pjsip.conf /etc/asterisk/ari.conf'
